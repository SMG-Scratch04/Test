<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>震度分布ビューワ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-sA+qw6b3w6kH8k2uJr2+4H2kQmJZbq7qv+0b3f0p+7k=" crossorigin=""/>
<style>
  html,body,#map { height:100%; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","メイリオ",sans-serif; }
  #controls {
    position: absolute; top:12px; left:12px; z-index:1000;
    background: rgba(255,255,255,0.95); padding:10px; border-radius:8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12); min-width:300px;
  }
  .row { display:flex; gap:8px; margin-bottom:6px; align-items:center; }
  input[type=text], input[type=url], select { flex:1; padding:6px 8px; border:1px solid #dfe6f0; border-radius:6px; }
  button { padding:6px 10px; border-radius:6px; border:none; background:#0366d6; color:#fff; cursor:pointer; }
  button.secondary { background:#6c757d; }
  .legend { display:flex; gap:6px; align-items:center; margin-top:6px; font-size:13px; }
  .sw { width:28px; height:14px; border-radius:3px; display:inline-block; }
  .small { font-size:13px; color:#444; }
</style>
</head>
<body>
<div id="map"></div>

<div id="controls" role="region" aria-label="コントロール">
  <div style="font-weight:700; margin-bottom:6px;">震度分布ビューワ</div>

  <div class="row">
    <input id="apiUrl" type="url" placeholder="例: https://your.api/earthquake/points.json" />
  </div>

  <div class="row">
    <label class="small" style="width:72px;">更新間隔</label>
    <input id="interval" type="text" value="8" /> <span class="small" style="width:36px; text-align:right;">秒</span>
  </div>

  <div class="row">
    <label class="small" style="width:72px;">フィールドマップ</label>
    <input id="fieldMap" type="text" value="lat,lon,intensity" 
      placeholder="緯度,経度,震度の順（例: lat,lon,scale）" />
  </div>

  <div style="display:flex; gap:8px;">
    <button id="start">開始</button>
    <button id="stop" class="secondary">停止</button>
    <button id="example" class="secondary">例をセット</button>
  </div>

  <div class="legend" aria-hidden="false" style="margin-top:8px;">
    <div class="small" style="width:72px;">凡例</div>
    <div><span class="sw" id="c0" style="background:#ededed"></span>0</div>
    <div><span class="sw" id="c1" style="background:#54cfe8"></span>1</div>
    <div><span class="sw" id="c2" style="background:#64e375"></span>2</div>
    <div><span class="sw" id="c3" style="background:#f0ed4d"></span>3</div>
    <div><span class="sw" id="c4" style="background:#eb9423"></span>4</div>
    <div><span class="sw" id="c5" style="background:#f74d4d"></span>5</div>
    <div><span class="sw" id="c6" style="background:#f03eb8"></span>6</div>
    <div><span class="sw" id="c7" style="background:#b347ed"></span>7</div>
  </div>

  <div style="margin-top:8px;" class="small">状態: <span id="status">停止中</span></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-o9N1j8gk2VQ+e7K2v1aG2G6kqX1q6f0y3Qf+3y0wYpM=" crossorigin=""></script>

<script>
/* 想定レスポンス形式（例）
[
  { "lat":35.68, "lon":139.76, "intensity": 3, "station":"Tokyo" },
  { "lat":34.69, "lon":135.50, "intensity": 1, "station":"Osaka" }
]
フィールド名が異なる場合は fieldMap にカンマ区切りで指定してください（例: latitude,longitude,scale）。
*/

const map = L.map('map', { zoomControl:true }).setView([36.0, 138.0], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

let markersLayer = L.layerGroup().addTo(map);
let timer = null;
let lastFetch = null;

const apiUrlEl = document.getElementById('apiUrl');
const intervalEl = document.getElementById('interval');
const fieldMapEl = document.getElementById('fieldMap');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start');
const stopBtn = document.getElementById('stop');
const exampleBtn = document.getElementById('example');

function colorForIntensity(i) {
  // 0〜7 を想定、値が大きいほど強い色
  const n = Number(i);
  if (isNaN(n)) return '#999999';
  if (n <= 0) return '#ededed';
  if (n === 1) return '#54cfe8';
  if (n === 2) return '#64e375';
  if (n === 3) return '#f0ed4d';
  if (n === 4) return '#eb9423';
  if (n === 5) return '#f74d4d';
  if (n === 6) return '#f03eb8';
  return '#b347ed';
}

function parseField(obj, keyPath) {
  if (!keyPath) return undefined;
  const parts = keyPath.split('.').map(s => s.trim());
  let cur = obj;
  for (const p of parts) {
    if (cur == null) return undefined;
    cur = cur[p];
  }
  return cur;
}

function clearMarkers() {
  markersLayer.clearLayers();
}

function renderPoints(points, fieldMap) {
  clearMarkers();
  const [latKey, lonKey, intKey] = fieldMap;
  points.forEach(p => {
    const lat = parseField(p, latKey);
    const lon = parseField(p, lonKey);
    const intensity = parseField(p, intKey);
    if (lat == null || lon == null) return;
    const color = colorForIntensity(intensity);
    const r = 6 + (Math.min(7, Math.max(0, Number(intensity))) || 0) * 2;
    const circle = L.circleMarker([Number(lat), Number(lon)], {
      radius: r,
      fillColor: color,
      color: '#333',
      weight: 0.6,
      fillOpacity: 0.9
    });
    let popupHtml = `<strong>震度: ${intensity ?? '—'}</strong><br/>`;
    if (p.station) popupHtml += `観測点: ${p.station}<br/>`;
    if (p.name) popupHtml += `場所: ${p.name}<br/>`;
    circle.bindPopup(popupHtml);
    markersLayer.addLayer(circle);
  });
}

async function fetchAndDraw() {
  const url = apiUrlEl.value.trim();
  if (!url) { statusEl.textContent = 'API URL を指定してください'; return; }
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    // points 配列を取り出す柔軟ロジック:
    let points = null;
    if (Array.isArray(json)) points = json;
    else if (Array.isArray(json.data)) points = json.data;
    else if (Array.isArray(json.points)) points = json.points;
    else if (Array.isArray(json.features)) {
      // GeoJSON FeatureCollection -> convert to simple points
      points = json.features.map(f => {
        const props = f.properties || {};
        const coords = (f.geometry && f.geometry.coordinates) || [];
        return Object.assign({}, props, { lon: coords[0], lat: coords[1] });
      });
    } else {
      // 最後の手段: 探索して最初に見つかった配列を採用
      for (const k in json) {
        if (Array.isArray(json[k])) { points = json[k]; break; }
      }
    }
    if (!points) { statusEl.textContent = 'レスポンスに点配列が見つかりません'; return; }

    const fieldMap = fieldMapEl.value.split(',').map(s => s.trim());
    renderPoints(points, fieldMap);
    statusEl.textContent = '更新: ' + new Date().toLocaleTimeString();
    lastFetch = Date.now();
  } catch (err) {
    statusEl.textContent = '取得エラー: ' + (err.message || err);
  }
}

function startPolling() {
  if (timer) return;
  const sec = Math.max(3, Number(intervalEl.value) || 8);
  statusEl.textContent = '取得中';
  fetchAndDraw();
  timer = setInterval(fetchAndDraw, sec * 1000);
}

function stopPolling() {
  if (timer) { clearInterval(timer); timer = null; }
  statusEl.textContent = '停止中';
}

startBtn.addEventListener('click', startPolling);
stopBtn.addEventListener('click', stopPolling);

exampleBtn.addEventListener('click', () => {
  // ここはユーザーが使うAPIに合わせて変更してください
  apiUrlEl.value = 'https://example.com/earthquake/points.json';
  fieldMapEl.value = 'lat,lon,intensity';
  intervalEl.value = '8';
  statusEl.textContent = '例をセットしました。実際のAPIに書き換えてください';
});

/* 保存/復元（ブラウザローカル） */
(function loadCfg(){
  try {
    const raw = localStorage.getItem('shindo_viewer_cfg');
    if (!raw) return;
    const cfg = JSON.parse(raw);
    apiUrlEl.value = cfg.apiUrl || apiUrlEl.value;
    fieldMapEl.value = cfg.fieldMap || fieldMapEl.value;
    intervalEl.value = cfg.interval || intervalEl.value;
  } catch(e){}
})();
window.addEventListener('beforeunload', () => {
  const cfg = { apiUrl: apiUrlEl.value, fieldMap: fieldMapEl.value, interval: intervalEl.value };
  localStorage.setItem('shindo_viewer_cfg', JSON.stringify(cfg));
});
</script>
</body>
</html>
